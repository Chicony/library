<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Библиотека</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
    }

    header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
    }

    h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
    }

    .stats {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-top: 20px;
    }

    .stat-item {
        background: rgba(255, 255, 255, 0.2);
        padding: 15px 30px;
        border-radius: 10px;
        backdrop-filter: blur(10px);
    }

    .stat-number {
        font-size: 2em;
        font-weight: bold;
    }

    .form-container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        margin-bottom: 30px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 2fr 2fr 1fr 1fr auto;
        gap: 15px;
        margin-bottom: 15px;
    }

    input, select, button {
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1em;
        transition: all 0.3s;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #667eea;
    }

    button {
        background: #667eea;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #5568d3;
        transform: translateY(-2px);
    }

    .search-container {
        margin-bottom: 20px;
    }

    .search-input {
        width: 100%;
        padding: 15px;
        font-size: 1.1em;
    }

    .books-section {
        background: white;
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .section-title {
        font-size: 1.8em;
        margin-bottom: 20px;
        color: #333;
        border-bottom: 3px solid #667eea;
        padding-bottom: 10px;
    }

    .books-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
    }

    .book-card {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 10px;
        border-left: 5px solid #667eea;
        transition: transform 0.3s;
    }

    .book-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .book-title {
        font-size: 1.3em;
        font-weight: bold;
        color: #333;
        margin-bottom: 8px;
    }

    .book-author {
        color: #666;
        margin-bottom: 10px;
    }

    .book-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
    }

    .book-genre {
        background: #667eea;
        color: white;
        padding: 5px 12px;
        border-radius: 15px;
        font-size: 0.85em;
    }

    .book-date {
        color: #888;
        font-size: 0.9em;
    }

    .book-rating {
        color: #ffc107;
        font-size: 1.2em;
    }

    .book-actions {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .btn-small {
        padding: 8px 15px;
        font-size: 0.9em;
        border-radius: 5px;
    }

    .btn-move {
        background: #28a745;
    }

    .btn-move:hover {
        background: #218838;
    }

    .btn-delete {
        background: #dc3545;
    }

    .btn-delete:hover {
        background: #c82333;
    }

    .empty-state {
        text-align: center;
        padding: 40px;
        color: #888;
        font-size: 1.1em;
    }

    @media (max-width: 768px) {
        .form-row {
            grid-template-columns: 1fr;
        }

        .stats {
            flex-direction: column;
            gap: 15px;
        }

        .books-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
<body>
  <div class="container">
    <header>
      <h1>📚 Моя Библиотека</h1>
      <div class="stats">
        <div class="stat-item">
          <div class="stat-number" id="readCount">0</div>
          <div>Прочитано</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="wantToReadCount">0</div>
          <div>Хочу прочитать</div>
        </div>
      </div>
    </header>
    <div class="form-container">
      <h2 style="margin-bottom: 20px;">Добавить книгу</h2>
        <div class="form-row">
            <input type="text" id="bookTitle" placeholder="Название книги">
            <input type="text" id="bookAuthor" placeholder="Автор">
            <select id="bookGenre">
                <option value="">Жанр</option>
                <option value="Фантастика">Фантастика</option>
                <option value="Детектив">Детектив</option>
                <option value="Роман">Роман</option>
                <option value="Фэнтези">Фэнтези</option>
                <option value="Научная литература">Научная литература</option>
                <option value="Биография">Биография</option>
                <option value="Другое">Другое</option>
            </select>
            <select id="bookStatus">
                <option value="want">Хочу прочитать</option>
                <option value="read">Прочитано</option>
            </select>
            <button onclick="addBook()">Добавить</button>
        </div>
        <div class="form-row" id="ratingRow" style="display: none;">
            <input type="number" id="bookRating" placeholder="Рейтинг (1-5)" min="1" max="5">
            <input type="date" id="bookDate">
        </div>
    </div>

    <div class="search-container">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск по названию или автору..." oninput="renderBooks()">
    </div>

    <div class="books-section">
        <h2 class="section-title">📖 Прочитано</h2>
        <div class="books-grid" id="readBooks"></div>
    </div>

    <div class="books-section">
        <h2 class="section-title">📋 Хочу прочитать</h2>
        <div class="books-grid" id="wantToReadBooks"></div>
    </div>
</div>

<script>
    let books = JSON.parse(localStorage.getItem('libraryBooks')) || [];

    document.getElementById('bookStatus').addEventListener('change', function() {
        document.getElementById('ratingRow').style.display = 
            this.value === 'read' ? 'grid' : 'none';
    });

    function saveBooks() {
        localStorage.setItem('libraryBooks', JSON.stringify(books));
    }

    function addBook() {
        const title = document.getElementById('bookTitle').value.trim();
        const author = document.getElementById('bookAuthor').value.trim();
        const genre = document.getElementById('bookGenre').value;
        const status = document.getElementById('bookStatus').value;
        const rating = document.getElementById('bookRating').value;
        const date = document.getElementById('bookDate').value;

        if (!title || !author) {
            alert('Пожалуйста, заполните название и автора');
            return;
        }

        const book = {
            id: Date.now(),
            title,
            author,
            genre,
            status,
            rating: status === 'read' ? rating : null,
            date: status === 'read' ? date : null
        };

        books.push(book);
        saveBooks();
        renderBooks();

        document.getElementById('bookTitle').value = '';
        document.getElementById('bookAuthor').value = '';
        document.getElementById('bookGenre').value = '';
        document.getElementById('bookRating').value = '';
        document.getElementById('bookDate').value = '';
    }

    function deleteBook(id) {
        if (confirm('Удалить эту книгу?')) {
            books = books.filter(book => book.id !== id);
            saveBooks();
            renderBooks();
        }
    }

    function moveBook(id, newStatus) {
        const book = books.find(b => b.id === id);
        book.status = newStatus;
        
        if (newStatus === 'read') {
            document.getElementById('ratingRow').style.display = 'grid';
            const rating = prompt('Оцените книгу (1-5):');
            const date = prompt('Дата прочтения (YYYY-MM-DD):', new Date().toISOString().split('T')[0]);
            
            if (rating && rating >= 1 && rating <= 5) {
                book.rating = rating;
            }
            if (date) {
                book.date = date;
            }
        }
        
        saveBooks();
        renderBooks();
    }

    function renderBooks() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        
        const readBooks = books.filter(book => 
            book.status === 'read' && 
            (book.title.toLowerCase().includes(searchTerm) || 
             book.author.toLowerCase().includes(searchTerm))
        );
        
        const wantToReadBooks = books.filter(book => 
            book.status === 'want' && 
            (book.title.toLowerCase().includes(searchTerm) || 
             book.author.toLowerCase().includes(searchTerm))
        );

        document.getElementById('readCount').textContent = readBooks.length;
        document.getElementById('wantToReadCount').textContent = wantToReadBooks.length;

        document.getElementById('readBooks').innerHTML = readBooks.length > 0 
            ? readBooks.map(book => createBookCard(book, 'read')).join('')
            : '<div class="empty-state">Пока нет прочитанных книг</div>';

        document.getElementById('wantToReadBooks').innerHTML = wantToReadBooks.length > 0
            ? wantToReadBooks.map(book => createBookCard(book, 'want')).join('')
            : '<div class="empty-state">Список желаний пуст</div>';
    }

    function createBookCard(book, type) {
        const stars = book.rating ? '★'.repeat(book.rating) + '☆'.repeat(5 - book.rating) : '';
        
        return `
            <div class="book-card">
                <div class="book-title">${book.title}</div>
                <div class="book-author">${book.author}</div>
                ${book.genre ? `<div class="book-genre">${book.genre}</div>` : ''}
                <div class="book-info">
                    ${book.rating ? `<div class="book-rating">${stars}</div>` : ''}
                    ${book.date ? `<div class="book-date">${book.date}</div>` : ''}
                </div>
                <div class="book-actions">
                    ${type === 'want' 
                        ? `<button class="btn-small btn-move" onclick="moveBook(${book.id}, 'read')">Прочитано ✓</button>`
                        : `<button class="btn-small btn-move" onclick="moveBook(${book.id}, 'want')">В список желаний</button>`
                    }
                    <button class="btn-small btn-delete" onclick="deleteBook(${book.id})">Удалить</button>
                </div>
            </div>
        `;
    }

    renderBooks();
  </script>
  </body>
</html>
